
name: Playwright Cucumber CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: UI and API Automation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CI: "true"
      HEADLESS: "true"
      VIDEO: "true"
      TRACE: "true"
      KEEP_SUCCESS_VIDEOS: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run UI and API Tests
        run: npm test

      - name: Generate Allure HTML Report
        if: always()
        shell: bash
        run: |
          if [ -d allure-results ] && [ -n "$(find allure-results -type f -print -quit)" ]; then
            npx allure generate allure-results --clean -o allure-report
          else
            echo "No Allure result files found."
          fi

      - name: Upload Reports and Test Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automation-reports-${{ github.run_number }}
          path: |
            allure-results/
            allure-report/
            logs/
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14
