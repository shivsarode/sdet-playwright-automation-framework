
name: Playwright Cucumber CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: UI and API Automation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CI: "true"
      HEADLESS: "true"
      VIDEO: "true"
      TRACE: "true"
      KEEP_SUCCESS_VIDEOS: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run UI and API tests
        run: npm test

      - name: Verify Allure results
        if: always()
        run: |
          echo "Workspace: $GITHUB_WORKSPACE"
          echo "Allure results directory:"
          if [ -d "$GITHUB_WORKSPACE/allure-results" ]; then
            find "$GITHUB_WORKSPACE/allure-results" -maxdepth 1 -type f | head -20
            echo "Total files: $(find "$GITHUB_WORKSPACE/allure-results" -type f | wc -l)"
          else
            echo "allure-results directory not found"
          fi
          echo "Current directory: $(pwd)"
          ls -la

      - name: Generate Allure report
        if: always()
        continue-on-error: true
        run: |
          if [ -d "$GITHUB_WORKSPACE/allure-results" ] && [ "$(find "$GITHUB_WORKSPACE/allure-results" -type f | wc -l)" -gt 0 ]; then
            npx allure generate "$GITHUB_WORKSPACE/allure-results" --clean -o "$GITHUB_WORKSPACE/allure-report"
          else
            echo "No Allure results were generated."
          fi

      - name: Upload test reports and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automation-reports-${{ github.run_number }}
          path: |
            allure-results/
            allure-report/
            logs/screenshots/
            logs/videos/
            logs/traces/
          if-no-files-found: warn
          retention-days: 14
